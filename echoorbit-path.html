<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoOrbit — Your path</title>
<meta name="description" content="See every sound unit in the EchoOrbit path and which ones you have unlocked.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="progression.js"></script>
<style>
  .topbar{
    position:sticky;
    top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:0.75rem;
    padding:0.9rem 1.25rem;
    background:rgba(23,19,53,0.94);
    backdrop-filter:blur(2px);
    z-index:5;
    flex-wrap:wrap;
  }
  .back-btn{
    background:none; border:none; color:var(--text);
    font-size:0.9rem; font-family:inherit; cursor:pointer;
    display:flex; align-items:center; gap:4px; padding:4px;
  }
  .back-btn:hover{color:var(--teal-light)}
  .progress-note{font-size:0.82rem; color:var(--text-muted)}

  .map-intro{
    max-width:500px;
    margin:0 auto;
    padding:1rem 1.25rem 0;
    font-size:0.88rem;
    color:var(--text-muted);
  }

  .map-wrap{
    position:relative;
    max-width:500px;
    margin:0 auto;
    padding:2rem 0 4rem;
  }

  .star{fill:var(--cream); animation:twinkle 3.5s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2} 50%{opacity:.85}}

  .route-svg{position:absolute; inset:0; z-index:1; display:block; width:100%; height:100%}

  .node-btn{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:inherit;
    font-family:inherit;
    cursor:pointer;
    z-index:2;
    width:120px;
  }
  .node-btn[disabled]{cursor:not-allowed}
  .node-btn:not([disabled]):hover .node-ring{transform:scale(1.06)}
  .node-ring{
    width:64px; height:64px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
    position:relative;
  }
  .node-ring.locked{background:rgba(245,239,224,0.08); border:2px dashed rgba(245,239,224,0.3)}
  .node-grade{
    position:absolute;
    top:-6px; right:-6px;
    background:var(--panel);
    border-radius:50%;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    font-size:0.68rem;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    color:var(--text);
  }
  .node-title{font-size:0.78rem; text-align:center; color:var(--text-muted); line-height:1.15}
  .node-btn[disabled] .node-title{color:var(--text-dim)}
  .node-badge{
    font-size:0.62rem;
    border-radius:10px;
    padding:1px 8px;
    font-weight:700;
  }
  .node-badge.current{background:var(--teal); color:var(--on-teal)}
  .node-badge.done{background:var(--amber); color:var(--on-amber)}
</style>
</head>
<body>

<a class="skip-link" href="#map">Skip to the path</a>

  <div class="topbar">
    <button class="back-btn" id="homeBtn" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Home
    </button>
    <span class="progress-note" id="progressNote"></span>
  </div>

  <p class="map-intro">
    Climb from the first sounds in kindergarten up to the full IPA lab in fifth grade.
    Finishing a unit unlocks the next one.
  </p>

  <div class="map-wrap" id="map"></div>

  <p class="sr-only" role="status" aria-live="polite" id="status"></p>

<script>
  // Restore saved progress, then merge anything passed in the URL so the
  // page also works when storage is blocked.
  restoreProgress();
  const params = new URLSearchParams(window.location.search);
  applyUnlockedParam(params.get('unlocked'));

  function homeHref(unitId){
    return 'index.html' + (unitId ? '?unit=' + encodeURIComponent(unitId) : '')
      + '&unlocked=' + encodeURIComponent(unlockedIdList());
  }

  const N = progression.length;
  const ROW_H = 150;
  const W = 500;
  const H = N * ROW_H + 80;
  // zigzag x positions: left, center, right, repeating -- laid out
  // bottom-to-top so climbing the page mirrors climbing through grades.
  const xSlots = [W*0.28, W*0.5, W*0.72];
  function nodePos(i){
    const rowFromBottom = N - 1 - i;
    return { x: xSlots[i % 3], y: H - 60 - rowFromBottom * ROW_H };
  }

  function planetIcon(colorKey, grade, locked, done){
    const colors = palette[colorKey];
    if (locked){
      return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(245,239,224,0.28)" stroke-width="2" stroke-dasharray="5 6"/>
        <rect x="24" y="30" width="16" height="13" rx="2.5" fill="rgba(245,239,224,0.45)"/>
        <path d="M27 30v-4a5 5 0 0 1 10 0v4" stroke="rgba(245,239,224,0.45)" stroke-width="2.2" fill="none"/>
      </svg>`;
    }
    const uid = 'cp' + Math.random().toString(36).slice(2,8);
    return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <defs><clipPath id="${uid}"><circle cx="32" cy="32" r="24"/></clipPath></defs>
      <circle cx="32" cy="32" r="24" fill="${colors.fill}"/>
      <g clip-path="url(#${uid})">
        <circle cx="41" cy="41" r="24" fill="${colors.dark}"/>
        <circle cx="23" cy="21" r="10" fill="${colors.light}"/>
      </g>
      <text x="32" y="37" fill="${colors.ink}" font-size="16" text-anchor="middle" font-weight="700" font-family="Baloo 2, sans-serif">${done ? '\u2713' : grade}</text>
    </svg>`;
  }

  function render(){
    const positions = progression.map((u,i) => nodePos(i));

    // Starfield
    let stars = '';
    for (let s = 0; s < Math.round(H/22); s++){
      stars += `<circle class="star" cx="${Math.random()*W}" cy="${Math.random()*H}" r="${(Math.random()*1.2+0.4).toFixed(2)}" style="animation-delay:${(Math.random()*3).toFixed(2)}s"/>`;
    }

    // Route line through all node positions, colored per-segment by
    // whether the traveler has actually reached that segment yet.
    let segments = '';
    for (let i = 0; i < positions.length - 1; i++){
      const a = positions[i], b = positions[i+1];
      const midY = (a.y + b.y) / 2;
      const d = `M ${a.x} ${a.y} C ${a.x} ${midY}, ${b.x} ${midY}, ${b.x} ${b.y}`;
      const reached = progression[i+1].unlocked;
      segments += `<path d="${d}" fill="none" stroke="${reached ? 'var(--teal)' : 'rgba(245,239,224,0.2)'}"
        stroke-width="3" stroke-linecap="round" ${reached ? '' : 'stroke-dasharray="2 9"'} opacity="${reached ? 0.7 : 1}"/>`;
    }

    const svg = `<svg class="route-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      ${stars}
      ${segments}
    </svg>`;

    const currentId = params.get('unit');
    const nodesHtml = progression.map((u,i) => {
      const pos = positions[i];
      const done = isCompleted(u.id);
      const badge = u.id === currentId
        ? '<span class="node-badge current">Last played</span>'
        : (done ? '<span class="node-badge done">Done</span>' : '');
      return `
      <button class="node-btn" type="button" style="left:${(pos.x/W*100).toFixed(2)}%; top:${(pos.y/H*100).toFixed(3)}%"
        ${u.unlocked ? '' : 'disabled aria-disabled="true"'}
        aria-label="${u.title}, grade ${u.grade}${done ? ', completed' : ''}${u.unlocked ? '' : ', locked'}"
        onclick="selectAndGoHome('${u.id}')">
        <div class="node-ring ${u.unlocked ? '' : 'locked'}">
          ${planetIcon(u.colorKey, u.grade, !u.unlocked, done)}
        </div>
        <span class="node-title">${u.title}</span>
        ${badge}
      </button>`;
    }).join('');

    const wrap = document.getElementById('map');
    wrap.innerHTML = svg + nodesHtml;
    wrap.style.aspectRatio = W + ' / ' + H;

    const unlockedCount = getUnlockedUnits().length;
    const doneCount = progression.filter(u => isCompleted(u.id)).length;
    document.getElementById('progressNote').textContent =
      unlockedCount + ' of ' + N + ' unlocked \u00b7 ' + doneCount + ' completed';
    document.getElementById('status').textContent =
      unlockedCount + ' of ' + N + ' units unlocked, ' + doneCount + ' completed.';
  }

  function goHome(){
    window.location.href = homeHref();
  }
  function selectAndGoHome(id){
    window.location.href = homeHref(id);
  }

  document.getElementById('homeBtn').addEventListener('click', goHome);
  render();

  // Scroll to roughly where the traveler currently is (near the
  // highest unlocked node) rather than dumping them at the very top.
  window.addEventListener('load', () => {
    const idx = progression.reduce((acc, u, i) => u.unlocked ? i : acc, 0);
    const pos = nodePos(idx);
    const wrap = document.getElementById('map');
    const scale = wrap.clientWidth / W;
    window.scrollTo({ top: Math.max(0, pos.y * scale - window.innerHeight * 0.6), behavior: 'instant' });
  });
</script>

</body>
</html>
